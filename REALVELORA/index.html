<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wavit — Waive the Wait</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #f8f7ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: -1px;
        color: #111;
      }
      #splash-logo span { color: #7c3aed; }
      #splash-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #ede9fe;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 20px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      body { background: #f8f7ff; margin: 0; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-logo">wav<span>it</span></div>
      <div id="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (!s) return;
          s.style.transition = 'opacity 0.3s';
          s.style.opacity = '0';
          setTimeout(function() { s && s.remove(); }, 300);
        }, 400);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

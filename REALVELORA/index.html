<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wavit — Waive the Wait</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@400;500;600;700&display=swap"></noscript>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #070b14;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: -1px;
        color: #fff;
      }
      #splash-logo span { color: #3b82f6; }
      #splash-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(59,130,246,0.2);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 20px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      body { background: #070b14; margin: 0; }
    </style>
  </head>
  <body>
    <div id="splash">
      <div id="splash-logo">wav<span>it</span></div>
      <div id="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (!s) return;
          s.style.transition = 'opacity 0.3s';
          s.style.opacity = '0';
          setTimeout(function() { s && s.remove(); }, 300);
        }, 400);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

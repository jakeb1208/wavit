<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6d28d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Wavit — Waive the Wait</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        background: #f8f7ff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 48px;
        font-weight: 900;
        letter-spacing: -1px;
        color: #111;
      }
      #splash-logo span { color: #7c3aed; }
      #splash-spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #ede9fe;
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-top: 20px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/assets/index-BaZQ8In3.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CEAZpRPd.css">
  </head>
  <body>
    <div id="splash">
      <div id="splash-logo">wav<span>it</span></div>
      <div id="splash-spinner"></div>
    </div>
    <div id="root"></div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        // Remove splash once React takes over
        var splash = document.getElementById('splash');
        if (splash) {
          var observer = new MutationObserver(function() {
            var root = document.getElementById('root');
            if (root && root.children.length > 0) {
              splash.style.opacity = '0';
              splash.style.transition = 'opacity 0.2s';
              setTimeout(function() { splash.remove(); }, 200);
              observer.disconnect();
            }
          });
          observer.observe(document.getElementById('root'), { childList: true });
        }
      });
    </script>
  </body>
</html>
